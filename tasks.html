<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务管理 - 裁判文书标注平台</title>
  <link rel="stylesheet" href="assets/vendor/element-plus.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div class="layout">
      
    <aside class="sidebar">
      <div class="brand">裁判文书标注平台</div>
      <el-menu background-color="#001529" text-color="#c0c4cc" active-text-color="#409eff"
               default-active="tasks.html" style="border-right:none;">
        <el-menu-item-group title="总览"><el-menu-item index="dashboard.html" @click="go('dashboard.html')">工作台</el-menu-item></el-menu-item-group><el-menu-item-group title="任务"><el-menu-item index="tasks.html" class="is-active" @click="go('tasks.html')">任务管理</el-menu-item><el-menu-item index="task-create.html" @click="go('task-create.html')">创建任务</el-menu-item><el-menu-item index="documents.html" @click="go('documents.html')">文书总库</el-menu-item></el-menu-item-group><el-menu-item-group title="标注"><el-menu-item index="segment.html" @click="go('segment.html')">文本切割</el-menu-item><el-menu-item index="segment-review.html" @click="go('segment-review.html')">切割复核</el-menu-item><el-menu-item index="annotate.html" @click="go('annotate.html')">标注工作台</el-menu-item><el-menu-item index="graph.html" @click="go('graph.html')">论证图示</el-menu-item></el-menu-item-group><el-menu-item-group title="裁定"><el-menu-item index="review.html" @click="go('review.html')">冲突解决</el-menu-item><el-menu-item index="compare.html" @click="go('compare.html')">差异比对</el-menu-item></el-menu-item-group><el-menu-item-group title="输出"><el-menu-item index="results.html" @click="go('results.html')">结果输出</el-menu-item></el-menu-item-group><el-menu-item-group title="管理"><el-menu-item index="configs.html" @click="go('configs.html')">配置中心</el-menu-item><el-menu-item index="users.html" @click="go('users.html')">用户管理</el-menu-item></el-menu-item-group>
      </el-menu>
    </aside>
      
    <div class="main">
      <div class="topbar">
        <div class="title">{{ pageTitle }}</div>
        <div class="right">
          <el-select v-model="role" size="small" style="width:130px" placeholder="切换角色">
            <el-option label="任务创建者" value="creator"></el-option>
            <el-option label="标注员" value="annotator"></el-option>
            <el-option label="裁定者" value="arbitrator"></el-option>
          </el-select>
          <el-tag size="small" type="info">演示账号</el-tag>
          <el-button size="small" @click="logout">退出</el-button>
        </div>
      </div>
      <div class="content">

        <h2 class="page-title">任务管理</h2>
        <p class="page-desc">管理标注任务的生命周期（创建 → 标注 → 冲突解决 → 结果输出）</p>
        <div class="card">
          <div style="margin-bottom:12px">
            <el-button type="primary" @click="go('task-create.html')">新建任务</el-button>
            <el-input v-model="kw" placeholder="搜索任务名称" style="width:240px" size="default" clearable></el-input>
          </div>
          <el-table :data="tasks" border style="width:100%">
            <el-table-column prop="name" label="任务名称" min-width="200"></el-table-column>
            <el-table-column prop="stage" label="阶段" width="110">
              <template #default="s"><el-tag :type="stageType(s.row.stage)" size="small">{{ s.row.stage }}</el-tag></template>
            </el-table-column>
            <el-table-column prop="docs" label="文书数" width="80"></el-table-column>
            <el-table-column prop="annotators" label="标注员" width="120"></el-table-column>
            <el-table-column prop="arbitrator" label="裁定者" width="100"></el-table-column>
            <el-table-column label="操作" width="140">
              <template #default="s">
                <el-button size="small" type="text" @click="go('annotate.html')">标注</el-button>
                <el-button size="small" type="text" @click="go('review.html')">裁定</el-button>
              </template>
            </el-table-column>
          </el-table>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus.full.min.js"></script>
  <script>
    const { createApp } = Vue;
    const App = {
      data() {
        return {
          pageTitle: '任务管理',
          role: 'annotator',
          
            kw: '',
            tasks: [
              { name: '劳务合同纠纷类案标注（第一批）', stage: '标注中', docs: 20, annotators: '张三、李四', arbitrator: '王老师' },
              { name: '居间合同"跳单"案例标注', stage: '冲突解决', docs: 8, annotators: '张三、李四', arbitrator: '王老师' },
              { name: '租赁合同纠纷类案标注', stage: '结果输出', docs: 14, annotators: '赵五、李四', arbitrator: '王老师' },
            ],

        };
      },
      methods: {
        go(p) { location.href = p; },
        logout() { location.href = 'index.html'; },
        
        stageType(s){ const m={标注中:'primary',冲突解决:'warning',结果输出:'success',创建中:'info'}; return m[s]||'info'; },

      }
    };
    createApp(App).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
