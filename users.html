<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - 裁判文书标注平台</title>
  <link rel="stylesheet" href="assets/vendor/element-plus.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div class="layout">
      
    <aside class="sidebar">
      <div class="brand">裁判文书标注平台</div>
      <el-menu background-color="#001529" text-color="#c0c4cc" active-text-color="#409eff"
               default-active="users.html" style="border-right:none;">
        <el-menu-item-group title="总览"><el-menu-item index="dashboard.html" @click="go('dashboard.html')">工作台</el-menu-item></el-menu-item-group><el-menu-item-group title="任务"><el-menu-item index="tasks.html" @click="go('tasks.html')">任务管理</el-menu-item><el-menu-item index="task-create.html" @click="go('task-create.html')">创建任务</el-menu-item><el-menu-item index="documents.html" @click="go('documents.html')">文书总库</el-menu-item></el-menu-item-group><el-menu-item-group title="标注"><el-menu-item index="segment.html" @click="go('segment.html')">文本切割</el-menu-item><el-menu-item index="segment-review.html" @click="go('segment-review.html')">切割复核</el-menu-item><el-menu-item index="annotate.html" @click="go('annotate.html')">标注工作台</el-menu-item><el-menu-item index="graph.html" @click="go('graph.html')">论证图示</el-menu-item></el-menu-item-group><el-menu-item-group title="裁定"><el-menu-item index="review.html" @click="go('review.html')">冲突解决</el-menu-item><el-menu-item index="compare.html" @click="go('compare.html')">差异比对</el-menu-item></el-menu-item-group><el-menu-item-group title="输出"><el-menu-item index="results.html" @click="go('results.html')">结果输出</el-menu-item></el-menu-item-group><el-menu-item-group title="管理"><el-menu-item index="configs.html" @click="go('configs.html')">配置中心</el-menu-item><el-menu-item index="users.html" class="is-active" @click="go('users.html')">用户管理</el-menu-item></el-menu-item-group>
      </el-menu>
    </aside>
      
    <div class="main">
      <div class="topbar">
        <div class="title">{{ pageTitle }}</div>
        <div class="right">
          <el-select v-model="role" size="small" style="width:130px" placeholder="切换角色" @change="setRole">
            <el-option label="任务创建者" value="creator"></el-option>
            <el-option label="标注员" value="annotator"></el-option>
            <el-option label="裁定者" value="arbitrator"></el-option>
          </el-select>
          <el-tag size="small" type="info">演示账号</el-tag>
          <el-button size="small" @click="logout">退出</el-button>
        </div>
      </div>
      <div class="content">

        <h2 class="page-title">用户管理</h2>
        <p class="page-desc">管理账号权限，并为文书追加或调整标注人员。一个人可以同时承担多个角色。</p>
        <div class="card">
          <div v-if="canManage" style="margin-bottom:14px"><el-button type="primary" @click="openUser()">新增用户</el-button></div>
          <el-table :data="users" border style="width:100%">
            <el-table-column prop="account" label="账号" width="130"></el-table-column>
            <el-table-column prop="name" label="姓名" width="130"></el-table-column>
            <el-table-column label="角色" min-width="260"><template #default="s"><el-tag v-for="r in s.row.roles" :key="r" size="small" style="margin-right:5px">{{ roleName(r) }}</el-tag></template></el-table-column>
            <el-table-column label="状态" width="100"><template #default="s"><el-tag :type="s.row.active?'success':'info'">{{ s.row.active?'启用':'停用' }}</el-tag></template></el-table-column>
            <el-table-column v-if="canManage" label="操作" width="160"><template #default="s"><el-button link type="primary" @click="openUser(s.row)">编辑</el-button><el-popconfirm :title="s.row.active?'停用后将从任务人员中移除，确定继续？':'确定启用该账号？'" @confirm="toggleUser(s.row)"><template #reference><el-button link :type="s.row.active?'danger':'success'">{{ s.row.active?'停用':'启用' }}</el-button></template></el-popconfirm></template></el-table-column>
          </el-table>
        </div>
        <div class="card">
          <h3 style="margin-top:0">文书人员调整</h3>
          <p style="font-size:13px;color:#606266">同一文书可分配给多名标注员；任务开始后可追加人员。此处演示分配记录，任务页尚未读取这些记录。</p>
          <el-select v-model="selectedDoc" placeholder="选择文书" style="width:min(100%,480px);margin-bottom:16px" @change="loadAssignment">
            <el-option v-for="d in docs" :key="d.id" :label="d.name" :value="d.id"></el-option>
          </el-select>
          <template v-if="selectedDoc">
            <el-form label-width="100px">
              <el-form-item label="标注员"><el-select v-model="assignForm.annotators" :disabled="!canManage" multiple filterable style="width:min(100%,480px)" placeholder="可选择多人"><el-option v-for="u in annotators" :key="u.account" :label="u.name+' ('+u.account+')'" :value="u.account"></el-option></el-select></el-form-item>
              <el-form-item label="裁定者"><el-select v-model="assignForm.arbitrators" :disabled="!canManage" multiple filterable style="width:min(100%,480px)" placeholder="可选择多人"><el-option v-for="u in arbitrators" :key="u.account" :label="u.name+' ('+u.account+')'" :value="u.account"></el-option></el-select></el-form-item>
            </el-form>
            <el-button v-if="canManage" type="primary" @click="saveAssignment">保存人员分配</el-button>
          </template>
          <el-empty v-else description="请先选择文书；若列表为空，请到文书总库导入"></el-empty>
        </div>
        <div class="card">
          <h3 style="margin-top:0">角色权限说明</h3>
          <el-table :data="permissions" border style="width:100%"><el-table-column prop="name" label="角色" width="150"></el-table-column><el-table-column prop="scope" label="权限范围"></el-table-column></el-table>
          <p style="font-size:13px;color:#909399">教师标准样例与学生独立练习位于文书总库。原始需求没有明确要求学习进度统计。</p>
          <el-link type="primary" href="documents.html?view=samples">进入教师标准样例 →</el-link>
        </div>
        <el-dialog v-model="userDialog" :title="userForm.originalAccount?'编辑用户':'新增用户'" width="520px">
          <el-form label-width="80px">
            <el-form-item label="账号"><el-input v-model="userForm.account" :disabled="!!userForm.originalAccount"></el-input></el-form-item>
            <el-form-item label="姓名"><el-input v-model="userForm.name"></el-input></el-form-item>
            <el-form-item label="角色"><el-checkbox-group v-model="userForm.roles"><el-checkbox label="creator">任务创建者</el-checkbox><el-checkbox label="annotator">标注员</el-checkbox><el-checkbox label="arbitrator">裁定者</el-checkbox></el-checkbox-group></el-form-item>
            <el-form-item label="状态"><el-switch v-model="userForm.active" active-text="启用"></el-switch></el-form-item>
          </el-form>
          <template #footer><el-button @click="userDialog=false">取消</el-button><el-button type="primary" @click="saveUser">保存</el-button></template>
        </el-dialog>
      </div>
    </div>
  </div>
  <script src="assets/vendor/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus.full.min.js"></script>
  <script>
    const { createApp } = Vue;
    const App = {
      data() {
        return {
          pageTitle: '用户管理',
          role: localStorage.getItem('demoRole') || 'creator',
          
          users: load('memberD.users', [
            {account:'teacher',name:'张老师',roles:['creator','arbitrator'],active:true},
            {account:'stu1',name:'张三',roles:['annotator'],active:true},
            {account:'stu2',name:'李四',roles:['annotator'],active:true},
            {account:'stu3',name:'赵五',roles:['annotator','arbitrator'],active:true}
          ]),
          docs: load('memberD.docs', [
            {id:'d1',name:'余某、徐某劳务合同纠纷一审判决书'},
            {id:'d2',name:'上海中原物业诉陶德华居间合同纠纷案'}
          ]),
          assignments: load('memberD.assignments', {}), selectedDoc:'',
          assignForm:{annotators:[],arbitrators:[]}, userDialog:false,userForm:{roles:[]},
          permissions:[
            {name:'任务创建者',scope:'上传文书、配置标签和指南、分配任务及授予相应权限'},
            {name:'标注员',scope:'查看和标注分配给自己的文书'},
            {name:'裁定者',scope:'查看各标注版本并确认最终结果'}
          ],

        };
      },
      computed: {
        canManage(){ return this.role==='creator'; },
        annotators(){ return this.users.filter(u=>u.active&&u.roles.includes('annotator')); },
        arbitrators(){ return this.users.filter(u=>u.active&&u.roles.includes('arbitrator')); }
      },
      mounted(){ if(this.docs.length){ this.selectedDoc=this.docs[0].id; this.loadAssignment(); } },
      methods: {
        go(p) { location.href = p; },
        logout() { location.href = 'index.html'; },
        setRole(v){ localStorage.setItem('demoRole',v); },
        roleName(r){ return {creator:'任务创建者',annotator:'标注员',arbitrator:'裁定者'}[r]||r; },
        persist(){ localStorage.setItem('memberD.users',JSON.stringify(this.users)); localStorage.setItem('memberD.assignments',JSON.stringify(this.assignments)); },
        openUser(u){ this.userForm=u?{...u,roles:[...u.roles],originalAccount:u.account}:{account:'',name:'',roles:[],active:true,originalAccount:''}; this.userDialog=true; },
        saveUser(){ const f=this.userForm; f.account=f.account.trim(); f.name=f.name.trim(); if(!f.account||!f.name||!f.roles.length)return this.$message.warning('请填写账号、姓名并选择角色'); if(!/^[A-Za-z0-9_-]+$/.test(f.account))return this.$message.warning('账号仅支持字母、数字、下划线和短横线'); if(!f.originalAccount&&this.users.some(u=>u.account===f.account))return this.$message.warning('账号已存在'); const u={account:f.account,name:f.name,roles:[...f.roles],active:f.active}; const i=this.users.findIndex(x=>x.account===f.account); if(i<0)this.users.push(u); else this.users.splice(i,1,u); this.cleanAssignments(); this.persist(); this.userDialog=false; this.$message.success('用户已保存'); },
        toggleUser(u){ u.active=!u.active; this.cleanAssignments(); this.persist(); this.loadAssignment(); },
        cleanAssignments(){ const validA=new Set(this.annotators.map(u=>u.account)),validR=new Set(this.arbitrators.map(u=>u.account)); for(const a of Object.values(this.assignments)){ a.annotators=(a.annotators||[]).filter(x=>validA.has(x)); a.arbitrators=(a.arbitrators||[]).filter(x=>validR.has(x)); } },
        loadAssignment(){ const a=this.assignments[this.selectedDoc]||{annotators:[],arbitrators:[]}; this.assignForm={annotators:[...a.annotators],arbitrators:[...a.arbitrators]}; },
        saveAssignment(){ if(!this.assignForm.annotators.length)return this.$message.warning('至少选择一名标注员'); if(!this.assignForm.arbitrators.length)return this.$message.warning('至少选择一名裁定者'); this.assignments[this.selectedDoc]={annotators:[...this.assignForm.annotators],arbitrators:[...this.assignForm.arbitrators]}; this.persist(); this.$message.success('人员分配已保存'); }
      }
    };
    function load(key,fallback){ try{const x=JSON.parse(localStorage.getItem(key));return x&&typeof x==='object'?x:fallback;}catch{return fallback;} }
    createApp(App).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
