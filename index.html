<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 裁判文书标注平台</title>
  <link rel="stylesheet" href="assets/vendor/element-plus.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="login-card" style="width:440px">
        <h1>裁判文书标注平台</h1>
        <div class="sub">法律论证结构标注与图示系统 · 原型演示</div>
        <el-form label-position="top">
          <el-form-item label="账号">
            <el-input v-model="username" placeholder="请输入账号" size="large"></el-input>
          </el-form-item>
          <el-form-item label="密码">
            <el-input v-model="password" type="password" placeholder="请输入密码" size="large" show-password></el-input>
          </el-form-item>
          <el-button type="primary" size="large" style="width:100%" @click="login">登 录</el-button>
        </el-form>
        <el-divider>或 以演示角色快速进入</el-divider>
        <div style="display:flex; gap:10px">
          <el-button v-for="r in roles" :key="r.value" style="flex:1" @click="enter(r.value)">{{ r.label }}</el-button>
        </div>
        <el-divider></el-divider>
        <div class="sub" style="margin-bottom:0; text-align:left; line-height:1.9">
          覆盖「创建任务 → 标注 → 冲突解决 → 结果输出」四阶段流程。<br/>
          本页为原型演示，<b>任意账号密码</b>点击登录即可进入工作台；<br/>
          三角色权限说明见「用户管理」页。
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus.full.min.js"></script>
  <script>
    const { createApp } = Vue;
    createApp({
      data() { return {
        username: '', password: '',
        roles: [
          { label: '任务创建者', value: 'creator' },
          { label: '标注员', value: 'annotator' },
          { label: '裁定者', value: 'arbitrator' },
        ],
      }; },
      methods: {
        login() { location.href = 'dashboard.html'; },
        enter(role) { localStorage.setItem('demoRole', role); location.href = 'dashboard.html'; }
      }
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
