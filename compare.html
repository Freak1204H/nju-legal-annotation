<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>差异比对 - 裁判文书标注平台</title>
  <link rel="stylesheet" href="assets/vendor/element-plus.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div class="layout">
      
    <aside class="sidebar">
      <div class="brand">裁判文书标注平台</div>
      <el-menu background-color="#001529" text-color="#c0c4cc" active-text-color="#409eff"
               default-active="compare.html" style="border-right:none;">
        <el-menu-item-group title="总览"><el-menu-item index="dashboard.html" @click="go('dashboard.html')">工作台</el-menu-item></el-menu-item-group><el-menu-item-group title="任务"><el-menu-item index="tasks.html" @click="go('tasks.html')">任务管理</el-menu-item><el-menu-item index="task-create.html" @click="go('task-create.html')">创建任务</el-menu-item><el-menu-item index="documents.html" @click="go('documents.html')">文书总库</el-menu-item></el-menu-item-group><el-menu-item-group title="标注"><el-menu-item index="segment.html" @click="go('segment.html')">文本切割</el-menu-item><el-menu-item index="segment-review.html" @click="go('segment-review.html')">切割复核</el-menu-item><el-menu-item index="annotate.html" @click="go('annotate.html')">标注工作台</el-menu-item><el-menu-item index="graph.html" @click="go('graph.html')">论证图示</el-menu-item></el-menu-item-group><el-menu-item-group title="裁定"><el-menu-item index="review.html" @click="go('review.html')">冲突解决</el-menu-item><el-menu-item index="compare.html" class="is-active" @click="go('compare.html')">差异比对</el-menu-item></el-menu-item-group><el-menu-item-group title="输出"><el-menu-item index="results.html" @click="go('results.html')">结果输出</el-menu-item></el-menu-item-group><el-menu-item-group title="管理"><el-menu-item index="configs.html" @click="go('configs.html')">配置中心</el-menu-item><el-menu-item index="users.html" @click="go('users.html')">用户管理</el-menu-item></el-menu-item-group>
      </el-menu>
    </aside>
      
    <div class="main">
      <div class="topbar">
        <div class="title">{{ pageTitle }}</div>
        <div class="right">
          <el-select v-model="role" size="small" style="width:130px" placeholder="切换角色">
            <el-option label="任务创建者" value="creator"></el-option>
            <el-option label="标注员" value="annotator"></el-option>
            <el-option label="裁定者" value="arbitrator"></el-option>
          </el-select>
          <el-tag size="small" type="info">演示账号</el-tag>
          <el-button size="small" @click="logout">退出</el-button>
        </div>
      </div>
      <div class="content">

        <h2 class="page-title">差异比对</h2>
        <p class="page-desc">按「标签 / 关系 / 边界」组织差异展示，高亮不一致处</p>
        <div class="card">
          <el-table :data="diffs" border style="width:100%" :row-class-name="rowClass">
            <el-table-column prop="type" label="差异类型" width="120">
              <template #default="s"><el-tag size="small" :type="typeTag(s.row.type)">{{ s.row.type }}</el-tag></template>
            </el-table-column>
            <el-table-column prop="item" label="位置" width="140"></el-table-column>
            <el-table-column prop="detail" label="差异说明" min-width="280"></el-table-column>
            <el-table-column prop="count" label="标注人数" width="100"></el-table-column>
          </el-table>
          <span class="proto-note">第一版可由裁定者人工比对，不强制自动比对（Q 差异识别方式）</span>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus.full.min.js"></script>
  <script>
    const { createApp } = Vue;
    const App = {
      data() {
        return {
          pageTitle: '差异比对',
          role: localStorage.getItem('demoRole') || 'annotator',
          
            diffs: [
              { type:'标签不同', item:'P5', detail:'A 标注为 SF，B 标注为 GM', count:'2/3 存在分歧' },
              { type:'关系缺失', item:'R4', detail:'A 标注 S(4,6)，B 未标注该关系', count:'1/3 缺失' },
              { type:'边界不同', item:'P9', detail:'框选范围长度不同（字符索引 120~158 vs 120~162）', count:'2/3 存在分歧' },
            ],

        };
      },
      computed: {
        
      },
      methods: {
        go(p) { location.href = p; },
        logout() { location.href = 'index.html'; },
        
        typeTag(t){ return {标签不同:'warning',关系缺失:'danger',边界不同:'info'}[t]||'info'; },
        rowClass(){ return 'diff-row'; },

      }
    };
    createApp(App).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
