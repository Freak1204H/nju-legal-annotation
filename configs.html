<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>配置中心 - 裁判文书标注平台</title>
  <link rel="stylesheet" href="assets/vendor/element-plus.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div class="layout">
      
    <aside class="sidebar">
      <div class="brand">裁判文书标注平台</div>
      <el-menu background-color="#001529" text-color="#c0c4cc" active-text-color="#409eff"
               default-active="configs.html" style="border-right:none;">
        <el-menu-item-group title="总览"><el-menu-item index="dashboard.html" @click="go('dashboard.html')">工作台</el-menu-item></el-menu-item-group><el-menu-item-group title="任务"><el-menu-item index="tasks.html" @click="go('tasks.html')">任务管理</el-menu-item><el-menu-item index="task-create.html" @click="go('task-create.html')">创建任务</el-menu-item><el-menu-item index="documents.html" @click="go('documents.html')">文书总库</el-menu-item></el-menu-item-group><el-menu-item-group title="标注"><el-menu-item index="segment.html" @click="go('segment.html')">文本切割</el-menu-item><el-menu-item index="segment-review.html" @click="go('segment-review.html')">切割复核</el-menu-item><el-menu-item index="annotate.html" @click="go('annotate.html')">标注工作台</el-menu-item><el-menu-item index="graph.html" @click="go('graph.html')">论证图示</el-menu-item></el-menu-item-group><el-menu-item-group title="裁定"><el-menu-item index="review.html" @click="go('review.html')">冲突解决</el-menu-item><el-menu-item index="compare.html" @click="go('compare.html')">差异比对</el-menu-item></el-menu-item-group><el-menu-item-group title="输出"><el-menu-item index="results.html" @click="go('results.html')">结果输出</el-menu-item></el-menu-item-group><el-menu-item-group title="管理"><el-menu-item index="configs.html" class="is-active" @click="go('configs.html')">配置中心</el-menu-item><el-menu-item index="users.html" @click="go('users.html')">用户管理</el-menu-item></el-menu-item-group>
      </el-menu>
    </aside>
      
    <div class="main">
      <div class="topbar">
        <div class="title">{{ pageTitle }}</div>
        <div class="right">
          <el-select v-model="role" size="small" style="width:130px" placeholder="切换角色">
            <el-option label="任务创建者" value="creator"></el-option>
            <el-option label="标注员" value="annotator"></el-option>
            <el-option label="裁定者" value="arbitrator"></el-option>
          </el-select>
          <el-tag size="small" type="info">演示账号</el-tag>
          <el-button size="small" @click="logout">退出</el-button>
        </div>
      </div>
      <div class="content">

        <h2 class="page-title">配置中心</h2>
        <p class="page-desc">管理标签体系（命题类型 + 关系类型）与指南版本</p>
        <div class="card">
          <h3 style="margin-top:0">一级标签（命题性质）</h3>
          <el-table :data="tags1" border style="width:100%">
            <el-table-column prop="code" label="代码" width="80"></el-table-column>
            <el-table-column prop="name" label="名称" width="160"></el-table-column>
            <el-table-column prop="def" label="定义"></el-table-column>
          </el-table>
          <h3>二级标签（一般规范判断 GM 子类）</h3>
          <el-table :data="tags2" border style="width:100%">
            <el-table-column prop="code" label="代码" width="80"></el-table-column>
            <el-table-column prop="name" label="名称" width="160"></el-table-column>
            <el-table-column prop="def" label="定义"></el-table-column>
          </el-table>
          <h3>关系类型</h3>
          <el-table :data="rels" border style="width:100%">
            <el-table-column prop="code" label="代码" width="80"></el-table-column>
            <el-table-column prop="name" label="名称" width="120"></el-table-column>
            <el-table-column prop="expr" label="形式化表达" width="160"></el-table-column>
            <el-table-column prop="def" label="逻辑含义"></el-table-column>
          </el-table>
        </div>
        <div class="card">
          <h3 style="margin-top:0">指南版本管理</h3>
          <el-timeline>
            <el-timeline-item timestamp="2026-09-01" type="primary">v1.2 当前版本（新增 SM-C 合同子类、嵌套关系表达）</el-timeline-item>
            <el-timeline-item timestamp="2026-04-14">v1.1 初始版本</el-timeline-item>
          </el-timeline>
          <span class="proto-note">标签体系支持动态调整，任务期间锁定（Q3/Q14）</span>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus.full.min.js"></script>
  <script>
    const { createApp } = Vue;
    const App = {
      data() {
        return {
          pageTitle: '配置中心',
          role: localStorage.getItem('demoRole') || 'annotator',
          
            tags1: [
              { code:'SF', name:'个别事实判断', def:'关于案件中个别对象的事实判断，是规范适用的前提条件' },
              { code:'GF', name:'一般事实判断', def:'为规范适用提供经验或背景支撑（社会常识、经验法则等）' },
              { code:'SM', name:'个别规范判断', def:'体现法院对本案的规范性评价，通常作为结论出现' },
              { code:'GM', name:'一般规范判断', def:'构成法律论证的规范基础，连接个案事实与裁判结论' },
            ],
            tags2: [
              { code:'GM-L', name:'法律条文', def:'法源权威性规范文件的直接引用或转述' },
              { code:'GM-I', name:'法律解释', def:'对法律条文含义、适用范围或条件的解释' },
              { code:'GM-C', name:'合同及合同解释', def:'合同条款或对合同条款的规范性解释' },
              { code:'GM-U', name:'习惯与行业惯例', def:'社会习惯、交易习惯或行业通行规则' },
              { code:'GM-M', name:'道德与价值观念', def:'基于价值判断、公序良俗或基本原则' },
              { code:'GM-O', name:'其他规范判断', def:'无法稳定归入上述类型的一般规范判断' },
            ],
            rels: [
              { code:'S', name:'支持关系', expr:'S(pi, pj)', def:'pi 为 pj 的成立提供理由' },
              { code:'A', name:'反对关系', expr:'A(po, pc)', def:'po 为 pc 的不成立提供理由' },
              { code:'J', name:'组合关系', expr:'J(p1,…,pn)', def:'多个命题缺一不可的合取结构' },
              { code:'M', name:'匹配关系', expr:'M(ps, pg)', def:'个别判断与一般判断的对应（要件-事实匹配）' },
              { code:'I', name:'同一关系', expr:'I(p1,…,pn)', def:'多个命题语义上表达同一判断内容' },
            ],

        };
      },
      computed: {
        
      },
      methods: {
        go(p) { location.href = p; },
        logout() { location.href = 'index.html'; },
        
      }
    };
    createApp(App).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
