<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文书总库 - 裁判文书标注平台</title>
  <link rel="stylesheet" href="assets/vendor/element-plus.css" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div class="layout">
      
    <aside class="sidebar">
      <div class="brand">裁判文书标注平台</div>
      <el-menu background-color="#001529" text-color="#c0c4cc" active-text-color="#409eff"
               default-active="documents.html" style="border-right:none;">
        <el-menu-item-group title="总览"><el-menu-item index="dashboard.html" @click="go('dashboard.html')">工作台</el-menu-item></el-menu-item-group><el-menu-item-group title="任务"><el-menu-item index="tasks.html" @click="go('tasks.html')">任务管理</el-menu-item><el-menu-item index="task-create.html" @click="go('task-create.html')">创建任务</el-menu-item><el-menu-item index="documents.html" class="is-active" @click="go('documents.html')">文书总库</el-menu-item></el-menu-item-group><el-menu-item-group title="标注"><el-menu-item index="segment.html" @click="go('segment.html')">文本切割</el-menu-item><el-menu-item index="segment-review.html" @click="go('segment-review.html')">切割复核</el-menu-item><el-menu-item index="annotate.html" @click="go('annotate.html')">标注工作台</el-menu-item><el-menu-item index="graph.html" @click="go('graph.html')">论证图示</el-menu-item></el-menu-item-group><el-menu-item-group title="裁定"><el-menu-item index="review.html" @click="go('review.html')">冲突解决</el-menu-item><el-menu-item index="compare.html" @click="go('compare.html')">差异比对</el-menu-item></el-menu-item-group><el-menu-item-group title="输出"><el-menu-item index="results.html" @click="go('results.html')">结果输出</el-menu-item></el-menu-item-group><el-menu-item-group title="管理"><el-menu-item index="configs.html" @click="go('configs.html')">配置中心</el-menu-item><el-menu-item index="users.html" @click="go('users.html')">用户管理</el-menu-item></el-menu-item-group>
      </el-menu>
    </aside>
      
    <div class="main">
      <div class="topbar">
        <div class="title">{{ pageTitle }}</div>
        <div class="right">
          <el-select v-model="role" size="small" style="width:130px" placeholder="切换角色">
            <el-option label="任务创建者" value="creator"></el-option>
            <el-option label="标注员" value="annotator"></el-option>
            <el-option label="裁定者" value="arbitrator"></el-option>
          </el-select>
          <el-tag size="small" type="info">演示账号</el-tag>
          <el-button size="small" @click="logout">退出</el-button>
        </div>
      </div>
      <div class="content">

        <h2 class="page-title">文书总库</h2>
        <p class="page-desc">管理待标注的裁判文书（支持 PDF / 纯文本 / Word）</p>
        <div class="card">
          <div style="margin-bottom:12px">
            <el-button type="primary">批量上传文书</el-button>
            <el-button>单文件导入</el-button>
            <el-button>手动录入</el-button>
            <el-tag size="small">已导入 {{ docs.length }} 份</el-tag>
          </div>
          <el-table :data="docs" border style="width:100%">
            <el-table-column prop="name" label="文书名称" min-width="240"></el-table-column>
            <el-table-column prop="type" label="案例类型" width="120"></el-table-column>
            <el-table-column prop="caseNo" label="案号" width="180"></el-table-column>
            <el-table-column prop="court" label="审理法院" min-width="180"></el-table-column>
            <el-table-column prop="status" label="状态" width="100">
              <template #default="s"><el-tag size="small" :type="s.row.status==='已提取'?'success':'info'">{{ s.row.status }}</el-tag></template>
            </el-table-column>
            <el-table-column label="操作" width="160">
              <template #default="s">
                <el-button size="small" type="text">提取裁判理由</el-button>
                <el-button size="small" type="text">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <span class="proto-note gap">需求3（教师教学）：教师标准样例库 / 学生练习入口尚未在本页体现</span>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus.full.min.js"></script>
  <script>
    const { createApp } = Vue;
    const App = {
      data() {
        return {
          pageTitle: '文书总库',
          role: localStorage.getItem('demoRole') || 'annotator',
          
            docs: [
              { name: '余某、徐某劳务合同纠纷一审判决书', type: '普通案例', caseNo: '(2023)苏0106民初18909号', court: '南京市鼓楼区人民法院', status: '已提取' },
              { name: '上海中原物业诉陶德华居间合同纠纷案', type: '指导性案例', caseNo: '指导案例1号', court: '最高人民法院', status: '已提取' },
              { name: '华阴市某合作社诉某服务中心租赁合同纠纷案', type: '参考案例', caseNo: '2025-07-2-111-002', court: '陕西省华阴市人民法院', status: '未提取' },
            ],

        };
      },
      computed: {
        
      },
      methods: {
        go(p) { location.href = p; },
        logout() { location.href = 'index.html'; },
        
      }
    };
    createApp(App).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
